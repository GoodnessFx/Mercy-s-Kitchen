
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mercy's Kitchen | Catering and Small Chops in Makurdi</title>
    <meta
      name="description"
      content="Mercy's Kitchen serves fresh small chops, rice dishes, drinks, and event catering packages in Makurdi. Order quickly through WhatsApp."
    />
    <meta
      name="keywords"
      content="Mercy's Kitchen, Makurdi catering, small chops, Nigerian food, event catering, WhatsApp ordering"
    />
    <meta name="theme-color" content="#25D366" />
    <meta property="og:title" content="Mercy's Kitchen" />
    <meta
      property="og:description"
      content="Fresh catering, small chops, and event packages in Makurdi with fast WhatsApp ordering."
    />
    <meta property="og:type" content="website" />
    <style>
      html, body {
        height: 100%;
        margin: 0;
      }

      #root {
        height: 100%;
      }
    </style>
  </head>

  <body>
    <div id="page-loader">
      <div class="splash-content">
        <div class="splash-logo">🍽️</div>
        <h1 class="splash-title">Mercy's Kitchen</h1>
        <p class="splash-subtitle">Cooking the vibe</p>
        <div class="loader-bar">
          <div class="loader-progress"></div>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Splash Screen Controller
      window.addEventListener('DOMContentLoaded', () => {
        const loader = document.getElementById('page-loader');
        
        // Show splash for exactly 3 seconds then fade out
        setTimeout(() => {
          loader.classList.add('fade-out');
          setTimeout(() => {
            loader.style.display = 'none';
          }, 1000); // Wait for fade transition to finish
        }, 3000);
      });
    </script>
  </body>
</html>
